<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <filter id="goldenHaze" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="5" seed="99" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="warmGlow">
      <feGaussianBlur stdDeviation="8"/>
      <feColorMatrix type="matrix" values="1.2 0 0 0 0  0 0.9 0 0 0  0 0 0.6 0 0  0 0 0 1 0"/>
    </filter>
    <radialGradient id="golden1" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f5c870"/>
      <stop offset="40%" stop-color="#d48a40"/>
      <stop offset="100%" stop-color="#6a3018"/>
    </radialGradient>
    <radialGradient id="golden2" cx="30%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#e8a850" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a05828" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4a2010" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c47830"/>
      <stop offset="50%" stop-color="#e8a048"/>
      <stop offset="100%" stop-color="#8a4820"/>
    </linearGradient>
    <linearGradient id="sienna" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a4018"/>
      <stop offset="50%" stop-color="#6a3010"/>
      <stop offset="100%" stop-color="#4a2008"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sienna)"/>
  <ellipse cx="500" cy="350" rx="450" ry="400" fill="url(#golden1)" filter="url(#goldenHaze)"/>
  <ellipse cx="250" cy="550" rx="400" ry="450" fill="url(#golden2)" filter="url(#goldenHaze)"/>
  <ellipse cx="600" cy="700" rx="350" ry="300" fill="url(#amber)" opacity="0.6" filter="url(#goldenHaze)"/>
  <ellipse cx="150" cy="250" rx="250" ry="280" fill="#d4884a" opacity="0.5" filter="url(#warmGlow)"/>
  <ellipse cx="700" cy="200" rx="200" ry="250" fill="#c47038" opacity="0.4" filter="url(#warmGlow)"/>
  <ellipse cx="400" cy="800" rx="500" ry="250" fill="#5a2810" opacity="0.7" filter="url(#goldenHaze)"/>
  <ellipse cx="400" cy="450" rx="300" ry="350" fill="#f5b860" opacity="0.3" filter="url(#warmGlow)"/>
  <rect width="800" height="1000" fill="url(#golden1)" opacity="0.15" filter="url(#goldenHaze)"/>
</svg>