<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <filter id="windSweep" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.015" numOctaves="4" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="diagonalBlur">
      <feGaussianBlur stdDeviation="3 8"/>
      <feOffset dx="5" dy="5"/>
    </filter>
    <linearGradient id="wind1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="30%" stop-color="#a8a8b8"/>
      <stop offset="60%" stop-color="#787888"/>
      <stop offset="100%" stop-color="#484858"/>
    </linearGradient>
    <linearGradient id="wind2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#606070" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#909098" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c8c8d0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8b8c8"/>
      <stop offset="100%" stop-color="#686878"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wind1)"/>
  <ellipse cx="200" cy="300" rx="500" ry="150" fill="url(#wind2)" transform="rotate(-35 400 500)" filter="url(#windSweep)"/>
  <ellipse cx="600" cy="500" rx="550" ry="120" fill="#8888a0" opacity="0.6" transform="rotate(-35 400 500)" filter="url(#windSweep)"/>
  <ellipse cx="300" cy="700" rx="480" ry="100" fill="url(#gust)" opacity="0.5" transform="rotate(-35 400 500)" filter="url(#windSweep)"/>
  <ellipse cx="500" cy="200" rx="400" ry="80" fill="#c8c8d8" opacity="0.7" transform="rotate(-35 400 500)" filter="url(#diagonalBlur)"/>
  <ellipse cx="400" cy="450" rx="450" ry="90" fill="#707080" opacity="0.55" transform="rotate(-35 400 500)" filter="url(#windSweep)"/>
  <ellipse cx="250" cy="600" rx="380" ry="70" fill="#a0a0b0" opacity="0.5" transform="rotate(-35 400 500)" filter="url(#diagonalBlur)"/>
  <ellipse cx="650" cy="800" rx="420" ry="110" fill="#585868" opacity="0.65" transform="rotate(-35 400 500)" filter="url(#windSweep)"/>
  <rect width="800" height="1000" fill="url(#wind2)" opacity="0.25" filter="url(#windSweep)"/>
</svg>