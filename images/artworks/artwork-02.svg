<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <filter id="rainTurbulence" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.08" numOctaves="5" seed="88" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="60" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="verticalStreak">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.001" numOctaves="3" seed="15"/>
      <feDisplacementMap in="SourceGraphic" scale="40" xChannelSelector="R" yChannelSelector="B"/>
      <feGaussianBlur stdDeviation="2 0"/>
    </filter>
    <linearGradient id="rain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="30%" stop-color="#142848"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1a2d"/>
    </linearGradient>
    <linearGradient id="rain2" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2a5080" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f2040" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="rain3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a6090" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1830" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#rain1)"/>
  <ellipse cx="200" cy="500" rx="150" ry="800" fill="url(#rain2)" filter="url(#verticalStreak)"/>
  <ellipse cx="450" cy="500" rx="120" ry="900" fill="#1a4070" opacity="0.7" filter="url(#verticalStreak)"/>
  <ellipse cx="650" cy="500" rx="180" ry="850" fill="url(#rain3)" filter="url(#verticalStreak)"/>
  <ellipse cx="100" cy="500" rx="100" ry="700" fill="#2a5590" opacity="0.5" filter="url(#verticalStreak)"/>
  <ellipse cx="750" cy="500" rx="130" ry="750" fill="#0f2550" opacity="0.6" filter="url(#verticalStreak)"/>
  <ellipse cx="350" cy="500" rx="90" ry="600" fill="#3a70a0" opacity="0.4" filter="url(#verticalStreak)"/>
  <rect width="800" height="1000" fill="url(#rain1)" opacity="0.3" filter="url(#rainTurbulence)"/>
  <ellipse cx="400" cy="500" rx="600" ry="400" fill="#4a80b0" opacity="0.15" filter="url(#rainTurbulence)"/>
</svg>